{% set name = "hatchling" %}
{% set version = "1.33.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4c422bd4d554fcff5de5b73e9596f85e41e9f97f7e553d8f7595ecb31a627bef

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - hatchling = hatchling.cli:hatchling
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    # bootstrapping
    - packaging >=24.2
    - pathspec >=0.10.1
    - pluggy >=1.0.0
    - tomli >=1.2.2  # [py<311]
    - trove-classifiers
  run:
    - packaging >=24.2
    - pathspec >=0.10.1
    - pluggy >=1.0.0
    - python
    - tomli >=1.2.2  # [py<311]
    - tomlkit >=0.11.1
    - trove-classifiers
  run_constrained:
    # editables is imported lazily in hatchling/builders/wheel.py (build_editable_detection)
    # and is not declared in upstream requires_dist
    - editables >=0.3,<1

test:
  imports:
    - hatchling
  commands:
    - pip check
    - hatchling --help
  requires:
    - pip

about:
  home: https://hatch.pypa.io/latest
  summary: Modern, extensible Python build backend
  description: Modern, extensible Python build backend
  dev_url: https://github.com/pypa/hatch/tree/master/backend
  doc_url: https://hatch.pypa.io/latest/plugins/about/#hatchling
  license: MIT
  license_file: LICENSE.txt
  license_family: MIT

extra:
  recipe-maintainers:
    - ofek
